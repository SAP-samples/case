repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      -   id: check-json
      -   id: check-yaml
      -   id: end-of-file-fixer
          exclude: ^tests/test_data/csv_validation/
      -   id: trailing-whitespace
      -   id: mixed-line-ending
          exclude: ^tests/test_data/csv_validation/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.4
    hooks:
      # Sort imports
      - id: ruff
        name: ruff-sort-imports
        args: [ --select, I, --fix ]
      # Run the formatter.
      - id: ruff-format
        types_or: [ python, pyi ]
      # Run the linter.
      - id: ruff-check
        name: ruff-lint
        types_or: [ python, pyi ]
        args: [ --fix ]
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        args: ['--drop-empty-cells']
        name: nbstripout
        description: 'nbstripout: strip output from Jupyter and IPython notebooks'
        entry: nbstripout
        language: python
        types: [ jupyter ]
